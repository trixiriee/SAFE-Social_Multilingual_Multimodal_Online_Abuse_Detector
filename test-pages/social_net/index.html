<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SocialNet</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
</head>

<body>

<header class="topbar">
  <div class="brand">SocialNet</div>
  <nav class="top-actions">
    <span onclick="openSearch()">🔍</span>
    <span onclick="toggleNotifications()">🔔</span>
    <span onclick="toggleAdmin()">🛡️</span>
    <span onclick="toggleTheme()">🌙</span>
  </nav>
</header>

<div class="layout">

  <!-- LEFT SIDEBAR -->
  <aside class="sidebar-left">
   <div class="nav-item active" data-route="feed" onclick="route('feed')">🏠 Home</div>
<div class="nav-item" data-route="profile" onclick="route('profile')">👤 Profile</div>
<div class="nav-item" data-route="memes" onclick="route('memes')">😂 Memes</div>

  </aside>

  <!-- MAIN CONTENT -->
  <main id="app"></main>

  <!-- RIGHT SIDEBAR -->
  <aside class="sidebar-right">
    <h4>Trending</h4>
    <p>#DeveloperHumor</p>
    <p>#AIProjects</p>
    <p>#DarkMode</p>
  </aside>

</div>

<!-- SEARCH OVERLAY -->
<div id="searchOverlay" class="overlay">
  <input placeholder="Search users, posts, hashtags…" />
</div>

<!-- NOTIFICATIONS -->
<div id="notifications" class="panel right">
  <h3>Notifications</h3>
  <p>🔥 Your post is trending</p>
  <p>💬 New comment</p>
</div>

<!-- ADMIN PANEL -->
<div id="adminPanel" class="panel left admin-only">
  <h3>Admin Panel</h3>
  <div class="admin-item">
    Reported post by @user123
    <button>Remove</button>
  </div>
</div>

<script src="js/app.js"></script>
<script src="js/overlays.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
